apiVersion: v1
kind: Pod
metadata:
  name: demo-serving-0
  namespace: volcano-demo
  labels:
    app: demo-serving
    demo.volcano.sh/sample: "true"
    scheduling.volcano.sh/group-name: demo-serving
    scheduling.volcano.sh/queue-name: demo-prod
spec:
  containers:
    - name: main
      image: busybox:1.36
      command: ["sh", "-c", "sleep 86400"]
---
apiVersion: v1
kind: Pod
metadata:
  name: demo-serving-1
  namespace: volcano-demo
  labels:
    app: demo-serving
    demo.volcano.sh/sample: "true"
    scheduling.volcano.sh/group-name: demo-serving
    scheduling.volcano.sh/queue-name: demo-prod
spec:
  containers:
    - name: main
      image: busybox:1.36
      command: ["sh", "-c", "sleep 86400"]
status:
  phase: Running
---
apiVersion: v1
kind: Pod
metadata:
  name: demo-pending-0
  namespace: volcano-demo
  labels:
    app: demo-pending
    demo.volcano.sh/sample: "true"
    scheduling.volcano.sh/group-name: demo-pending
    scheduling.volcano.sh/queue-name: demo-research
spec:
  containers:
    - name: main
      image: busybox:1.36
      command: ["sh", "-c", "sleep 86400"]
  nodeSelector:
    kubernetes.io/hostname: demo-unreachable-node
status:
  phase: Pending
---
apiVersion: v1
kind: Pod
metadata:
  name: demo-ops-agent
  namespace: volcano-demo-ops
  labels:
    app: demo-ops-agent
    demo.volcano.sh/sample: "true"
    scheduling.volcano.sh/queue-name: demo-dev
spec:
  containers:
    - name: main
      image: busybox:1.36
      command: ["sh", "-c", "sleep 86400"]
status:
  phase: Running
---
apiVersion: v1
kind: Pod
metadata:
  name: demo-failed-task
  namespace: volcano-demo-ops
  labels:
    app: demo-failed-task
    demo.volcano.sh/sample: "true"
    scheduling.volcano.sh/queue-name: demo-dev
spec:
  containers:
    - name: main
      image: busybox:1.36
      command: ["sh", "-c", "exit 1"]
status:
  phase: Failed
---
apiVersion: v1
kind: Pod
metadata:
  name: demo-succeeded-task
  namespace: volcano-demo-ops
  labels:
    app: demo-succeeded-task
    demo.volcano.sh/sample: "true"
    scheduling.volcano.sh/queue-name: demo-dev
spec:
  containers:
    - name: main
      image: busybox:1.36
      command: ["sh", "-c", "echo done"]
status:
  phase: Succeeded
