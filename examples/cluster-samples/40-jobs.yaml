---
apiVersion: batch.volcano.sh/v1alpha1
kind: Job
metadata:
  name: demo-job-completed
  namespace: volcano-demo
  labels:
    demo.volcano.sh/sample: "true"
spec:
  minAvailable: 1
  queue: demo-research
  tasks:
    - replicas: 1
      name: task
      template:
        spec:
          containers:
            - name: main
              image: busybox:1.36
              command: ["sh", "-c", "echo done"]
          restartPolicy: Never
status:
  state:
    phase: Completed
