  name: demo-dev
  labels:
    demo.volcano.sh/sample: "true"
spec:
  parent: demo-root
  weight: 1
  reclaimable: true
  capability:
    cpu: "2"
    memory: 4Gi
status:
  state: Open
---
apiVersion: scheduling.volcano.sh/v1beta1
kind: Queue
